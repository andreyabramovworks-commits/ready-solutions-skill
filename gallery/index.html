<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ready Solutions</title>
<style>
:root{font:15px/1.5 system-ui,Arial,sans-serif;color:#192639;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142742;color:#fff;padding:18px 24px}h1{font-size:23px;margin:0}header p{margin:2px 0;color:#c6d5eb}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);height:calc(100vh - 84px)}aside{background:#fff;border-right:1px solid #dce4ee;overflow:auto;padding:16px}main{overflow:auto;padding:25px;max-width:1100px;width:100%;margin:auto}input{width:100%;padding:11px;font:inherit;border:1px solid #b6c4d7;border-radius:9px;margin:7px 0}#count,.muted{color:#5a6b82;font-size:13px}#results{display:grid;gap:6px;margin-top:12px}#results button{border:1px solid #dce4ee;border-radius:9px;background:#fff;text-align:left;padding:10px;cursor:pointer;font:inherit}#results button.active{border-color:#3568d9;background:#eaf0ff}#results small{display:block;color:#64758d}h2{font-size:26px;margin:7px 0}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#e8efff;color:#284f98;font-size:12px}.notice{background:#fff4d9;padding:12px;border-radius:9px;border:1px solid #eed799}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.actions a{background:#2460d0;color:#fff;padding:10px 13px;border-radius:8px;text-decoration:none}.actions a.secondary{background:#e7edf7;color:#19365e}.actions a[hidden]{display:none}.panel{background:white;border:1px solid #dce4ee;border-radius:12px;padding:18px}pre{white-space:pre-wrap;word-break:break-word;max-height:56vh;overflow:auto;background:#122036;color:#d8e8ff;padding:16px;border-radius:8px;font:13px/1.5 Consolas,monospace}@media(max-width:760px){.layout{display:block;height:auto}aside{max-height:40vh;border-bottom:1px solid #dce4ee}main{padding:16px}}
</style></head><body>
<header><h1>Ready Solutions</h1><p>Исходники и настоящие демонстрации компонентов</p></header>
<div class="layout"><aside><label for="search">Найти решение</label><input id="search" placeholder="Название, задача или библиотека"><div id="count"></div><div id="results"></div></aside>
<main><span id="status" class="pill"></span><h2 id="title"></h2><p id="meta" class="muted"></p><p id="description"></p><p id="notice" class="notice"></p>
<div class="actions"><a id="live" target="_blank" rel="noopener" hidden>Открыть работающий пример ↗</a><a id="source" class="secondary" target="_blank" rel="noopener">Открыть локальный исходник</a><a id="repo" class="secondary" target="_blank" rel="noopener">Репозиторий ↗</a></div>
<section class="panel"><strong id="codeheading">Исходный код</strong><p id="codepath" class="muted"></p><pre id="code">Загрузка…</pre></section></main></div>
<script src="catalog-data.js"></script><script>
const data=window.CATALOG||[],$=s=>document.querySelector(s),list=$('#results'),search=$('#search');let selected=null;
const aliases={таблица:'table',форма:'form',диалог:'dialog',дерево:'tree',редактор:'editor',график:'chart',схема:'diagramming',календарь:'calendar',загрузка:'upload'};
function render(){const raw=search.value.trim().toLowerCase(),q=aliases[raw]||raw;const matches=data.filter(x=>(x.id+' '+x.name+' '+x.source+' '+x.tags.join(' ')+' '+x.what).toLowerCase().includes(q));$('#count').textContent=matches.length+' из '+data.length+' записей';list.replaceChildren(...matches.slice(0,150).map(x=>{const b=document.createElement('button');b.type='button';b.textContent=x.name;const s=document.createElement('small');s.textContent=x.source+' · '+(x.liveKind==='exact-example'?'точный пример':x.liveKind==='source-doc-route'?'адрес документации':x.live?'страница компонента':'только исходник');b.append(s);b.classList.toggle('active',selected?.id===x.id);b.onclick=()=>select(x);return b}));if(matches.length>150){const p=document.createElement('p');p.className='muted';p.textContent='Показаны первые 150. Уточните поиск.';list.append(p)}if(!matches.length)list.textContent='Ничего не найдено'}
function select(x){selected=x;history.replaceState(null,'','#'+encodeURIComponent(x.id));$('#title').textContent=x.name;$('#meta').textContent=x.source+' · '+x.tags.join(', ');$('#description').textContent=x.what;$('#source').href=x.source_path;$('#repo').href=x.repo;$('#codepath').textContent=x.local_path;$('#codeheading').textContent=x.code_kind==='directory'?'Файлы исходника':'Исходный код';$('#status').textContent=x.liveKind==='exact-example'?'Точный работающий пример':x.liveKind==='source-doc-route'?'Адрес документации из исходников':x.live?'Страница компонента':'Демонстрация не подключена';$('#notice').textContent=x.liveKind==='exact-example'?'Откроется опубликованный пример этого решения. Ниже — исходник из скачанного репозитория.':x.liveKind==='source-doc-route'?'Адрес взят из маршрута документации скачанного репозитория. Открытие страницы сейчас не проверено; она может не показывать именно этот пример.':x.live?'Откроется страница компонента с примерами. Она может не показывать именно этот вариант исходного кода.':'Для этой записи работающая демонстрация пока не подтверждена. Исходник доступен для изучения.';$('#live').hidden=!x.live;$('#live').textContent=x.liveKind==='exact-example'?'Открыть точный пример ↗':'Открыть страницу компонента ↗';if(x.live)$('#live').href=x.live;$('#code').textContent='Загрузка исходника…';render();const s=document.createElement('script');s.src=x.code_path;s.onload=()=>{if(selected===x)$('#code').textContent=window.CARD_CODE};s.onerror=()=>{if(selected===x)$('#code').textContent='Не удалось открыть исходник. Используйте кнопку выше.'};document.body.append(s)}
search.addEventListener('input',render);render();const initial=data.find(x=>x.id===decodeURIComponent(location.hash.slice(1)))||data[0];if(initial)select(initial);
</script></body></html>
